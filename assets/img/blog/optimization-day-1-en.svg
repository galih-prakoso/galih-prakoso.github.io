<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" rx="16" />

  <!-- Top Header Banner -->
  <rect x="36" y="28" width="1128" height="96" rx="14" fill="url(#headerGrad)" />
  <text x="68" y="68" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">WHAT &amp; WHERE DO WE OPTIMIZE?</text>
  <text x="68" y="98" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#CBD5E1">Making the best possible decision under limited resources &amp; real-world constraints</text>
  <rect x="945" y="52" width="190" height="44" rx="22" fill="#2563EB" />
  <text x="1040" y="79" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Series #1 • Industrial Eng.</text>

  <!-- LEFT PANEL: Everyday Life Optimization -->
  <rect x="36" y="144" width="460" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="36" y="144" width="460" height="44" rx="14" fill="#FEF3C7" />
  <rect x="36" y="172" width="460" height="16" fill="#FEF3C7" />
  <text x="60" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#92400E">1. EVERYDAY TRADE-OFFS</text>

  <!-- House Dilemma -->
  <rect x="58" y="206" width="416" height="118" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="76" y="232" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Buying a Home</text>

  <!-- Option A -->
  <rect x="76" y="244" width="175" height="64" rx="8" fill="#EFF6FF" stroke="#93C5FD" />
  <text x="163" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8">Spacious House</text>
  <text x="163" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Far from workplace</text>
  <text x="163" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#DC2626">- High Commute Time</text>

  <text x="266" y="281" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">VS</text>

  <!-- Option B -->
  <rect x="281" y="244" width="175" height="64" rx="8" fill="#F0FDF4" stroke="#86EFAC" />
  <text x="368" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803D">Compact Home</text>
  <text x="368" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">City center location</text>
  <text x="368" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#DC2626">- Limited Living Space</text>

  <!-- Budget Constraint Pill -->
  <rect x="58" y="340" width="416" height="134" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" />
  <text x="76" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#92400E">Bounded by Constraints</text>
  <text x="76" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">• Available financial budget</text>
  <text x="76" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">• Fuel consumption, comfort &amp; after-sales service</text>
  <text x="76" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">• Allocating remaining funds to other life priorities</text>
  <text x="76" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309">→ Result: We choose the OPTIMAL option, not perfection.</text>

  <!-- RIGHT PANEL: Engineering Case Study (4 Car Designs) -->
  <rect x="516" y="144" width="648" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="516" y="144" width="648" height="44" rx="14" fill="#DBEAFE" />
  <rect x="516" y="172" width="648" height="16" fill="#DBEAFE" />
  <text x="540" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#1E40AF">2. ENGINEERING CASE STUDY: AUTOMOTIVE DESIGN TRADE-OFFS</text>

  <!-- Table Column Headers -->
  <text x="540" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">VEHICLE TYPE</text>
  <text x="735" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">ACCELERATION</text>
  <text x="875" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">FUEL ECONOMY</text>
  <text x="1015" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">CAPACITY / LOAD</text>

  <!-- Row 1: Sports Car -->
  <rect x="536" y="224" width="608" height="56" rx="8" fill="#F8FAFC" />
  <text x="548" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Sports Car</text>
  <text x="548" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Max power, light body</text>
  <rect x="735" y="242" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="735" y="242" width="104" height="12" rx="6" fill="#EF4444" />
  <rect x="875" y="242" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="875" y="242" width="28" height="12" rx="6" fill="#F59E0B" />
  <rect x="1015" y="242" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="1015" y="242" width="32" height="12" rx="6" fill="#3B82F6" />

  <!-- Row 2: Fuel-Efficient Car -->
  <rect x="536" y="288" width="608" height="56" rx="8" fill="#F8FAFC" />
  <text x="548" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Fuel-Efficient Car</text>
  <text x="548" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Small frame, low power</text>
  <rect x="735" y="306" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="735" y="306" width="42" height="12" rx="6" fill="#EF4444" />
  <rect x="875" y="306" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="875" y="306" width="104" height="12" rx="6" fill="#10B981" />
  <rect x="1015" y="306" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="1015" y="306" width="52" height="12" rx="6" fill="#3B82F6" />

  <!-- Row 3: Family Car -->
  <rect x="536" y="352" width="608" height="56" rx="8" fill="#F8FAFC" />
  <text x="548" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Large Family Car</text>
  <text x="548" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Constraint: 3 seat rows</text>
  <rect x="735" y="370" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="735" y="370" width="66" height="12" rx="6" fill="#EF4444" />
  <rect x="875" y="370" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="875" y="370" width="68" height="12" rx="6" fill="#10B981" />
  <rect x="1015" y="370" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="1015" y="370" width="84" height="12" rx="6" fill="#3B82F6" />

  <!-- Row 4: Cargo Truck -->
  <rect x="536" y="416" width="608" height="56" rx="8" fill="#F8FAFC" />
  <text x="548" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Cargo Truck</text>
  <text x="548" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Heavy haul, massive size</text>
  <rect x="735" y="434" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="735" y="434" width="24" height="12" rx="6" fill="#EF4444" />
  <rect x="875" y="434" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="875" y="434" width="34" height="12" rx="6" fill="#F59E0B" />
  <rect x="1015" y="434" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="1015" y="434" width="106" height="12" rx="6" fill="#3B82F6" />

  <!-- BOTTOM PANEL: 3 Core Components of Mathematical Modeling -->
  <rect x="36" y="514" width="1128" height="132" rx="14" fill="#0F172A" />
  <text x="64" y="546" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">3 CORE PILLARS OF MATHEMATICAL OPTIMIZATION MODELING</text>

  <!-- Pillar 1 -->
  <rect x="64" y="562" width="330" height="66" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="82" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">1. Decision Variables (x)</text>
  <text x="82" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Inputs we control: engine size, order quantity</text>

  <!-- Arrow 1 -->
  <text x="415" y="601" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38BDF8">→</text>

  <!-- Pillar 2 -->
  <rect x="436" y="562" width="330" height="66" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="454" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">2. Objective Function f(x)</text>
  <text x="454" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Goal to Maximize (profit) or Minimize (cost)</text>

  <!-- Arrow 2 -->
  <text x="787" y="601" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38BDF8">←</text>

  <!-- Pillar 3 -->
  <rect x="808" y="562" width="330" height="66" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="826" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">3. Constraints (g(x) ≤ b)</text>
  <text x="826" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Limits we must obey: budget, seats, capacity</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
