<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" rx="16" />

  <!-- Top Header Banner -->
  <rect x="36" y="28" width="1128" height="96" rx="14" fill="url(#headerGrad)" />
  <text x="68" y="68" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">APA &amp; DI MANA KITA MENGOPTIMALKAN?</text>
  <text x="68" y="98" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#CBD5E1">Mengambil keputusan terbaik di tengah keterbatasan sumber daya &amp; batasan dunia nyata</text>
  <rect x="819" y="52" width="316" height="44" rx="22" fill="#2563EB" />
  <text x="977" y="79" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Seri #1 • Optimasi Teknik Industri</text>

  <!-- LEFT PANEL: Everyday Life Optimization -->
  <rect x="36" y="144" width="460" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="36" y="144" width="460" height="44" rx="14" fill="#FEF3C7" />
  <rect x="36" y="172" width="460" height="16" fill="#FEF3C7" />
  <text x="60" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#92400E">1. PILIHAN SEHARI-HARI (TRADE-OFF)</text>

  <!-- House Dilemma -->
  <rect x="58" y="206" width="416" height="118" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="76" y="232" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Memilih Rumah</text>

  <!-- Option A -->
  <rect x="76" y="244" width="175" height="64" rx="8" fill="#EFF6FF" stroke="#93C5FD" />
  <text x="163" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8">Rumah Luas</text>
  <text x="163" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Jauh dari tempat kerja</text>
  <text x="163" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#DC2626">- Waktu tempuh lama</text>

  <text x="266" y="281" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">VS</text>

  <!-- Option B -->
  <rect x="281" y="244" width="175" height="64" rx="8" fill="#F0FDF4" stroke="#86EFAC" />
  <text x="368" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803D">Rumah Mungil</text>
  <text x="368" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Dekat pusat kota</text>
  <text x="368" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#DC2626">- Ruang hidup terbatas</text>

  <!-- Budget Constraint Pill -->
  <rect x="58" y="340" width="416" height="134" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2" />
  <text x="76" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#92400E">Dibatasi oleh Keterbatasan Sumber Daya</text>
  <text x="76" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">• Ketersediaan dana</text>
  <text x="76" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">• Konsumsi BBM, kenyamanan &amp; layanan purna jual</text>
  <text x="76" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">• Membagi sisa dana untuk prioritas hidup lain</text>
  <text x="76" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309">→ Hasil: Kita memilih opsi OPTIMAL, bukan kesempurnaan.</text>

  <!-- RIGHT PANEL: Engineering Case Study (4 Car Designs) -->
  <rect x="516" y="144" width="648" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)" />
  <rect x="516" y="144" width="648" height="44" rx="14" fill="#DBEAFE" />
  <rect x="516" y="172" width="648" height="16" fill="#DBEAFE" />
  <text x="540" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#1E40AF">2. STUDI KASUS REKAYASA: TRADE-OFF DESAIN OTOMOTIF</text>

  <!-- Table Column Headers -->
  <text x="540" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">TIPE KENDARAAN</text>
  <text x="735" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">AKSELERASI</text>
  <text x="875" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">HEMAT BBM</text>
