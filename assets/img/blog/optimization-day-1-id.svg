  <rect x="1015" y="370" width="84" height="12" rx="6" fill="#3B82F6" />

  <!-- Row 4: Cargo Truck -->
  <rect x="536" y="416" width="608" height="56" rx="8" fill="#F8FAFC" />
  <text x="548" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Truk Kargo</text>
  <text x="548" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Angkut berat, ukuran besar</text>
  <rect x="735" y="434" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="735" y="434" width="24" height="12" rx="6" fill="#EF4444" />
  <rect x="875" y="434" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="875" y="434" width="34" height="12" rx="6" fill="#F59E0B" />
  <rect x="1015" y="434" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="1015" y="434" width="106" height="12" rx="6" fill="#3B82F6" />

  <!-- BOTTOM PANEL: 3 Core Components of Mathematical Modeling -->
  <rect x="36" y="514" width="1128" height="132" rx="14" fill="#0F172A" />
  <text x="64" y="546" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">3 PILAR UTAMA PEMODELAN OPTIMASI MATEMATIS</text>

  <!-- Pillar 1 -->
  <rect x="64" y="562" width="330" height="66" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="82" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">1. Variabel Keputusan (x)</text>
  <text x="82" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Yang kita atur: ukuran mesin, jumlah pesanan</text>

  <!-- Arrow 1 -->
  <text x="415" y="601" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38BDF8">→</text>

  <!-- Pillar 2 -->
  <rect x="436" y="562" width="330" height="66" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="454" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">2. Fungsi Tujuan f(x)</text>
  <text x="454" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Dimaksimalkan (laba) atau diminimalkan (biaya)</text>

  <!-- Arrow 2 -->
  <text x="787" y="601" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38BDF8">←</text>

  <!-- Pillar 3 -->
  <rect x="808" y="562" width="330" height="66" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="826" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">3. Batasan (g(x) ≤ b)</text>
  <text x="826" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Yang harus dipatuhi: anggaran, kursi, kapasitas</text>
