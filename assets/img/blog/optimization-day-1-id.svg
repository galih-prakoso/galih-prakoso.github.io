  <rect x="536" y="288" width="608" height="56" rx="8" fill="#F8FAFC" />
  <text x="548" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Mobil Hemat BBM</text>
  <text x="548" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Bodi kecil, tenaga rendah</text>
  <rect x="735" y="306" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="735" y="306" width="42" height="12" rx="6" fill="#EF4444" />
  <rect x="875" y="306" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="875" y="306" width="104" height="12" rx="6" fill="#10B981" />
  <rect x="1015" y="306" width="110" height="12" rx="6" fill="#E2E8F0" />
  <rect x="1015" y="306" width="52" height="12" rx="6" fill="#3B82F6" />

  <!-- Row 3: Family Car -->
  <rect x="536" y="352" width="608" height="56" rx="8" fill="#F8FAFC" />
  <text x="548" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Mobil Keluarga Besar</text>
  <text x="548" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Batasan: 3 baris kursi</text>
