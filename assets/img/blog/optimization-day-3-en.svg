<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="cardShadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="620" fill="url(#bgGrad3)" rx="16" />

  <!-- Top Header Banner -->
  <rect x="36" y="28" width="1128" height="92" rx="14" fill="url(#headerGrad3)" />
  <text x="68" y="66" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">ANATOMY OF AN OPTIMIZATION MODEL</text>
  <text x="68" y="96" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#CBD5E1">How real-world problems are structured into Variables, Constraints, and an Objective Function</text>
  <rect x="799" y="50" width="336" height="44" rx="22" fill="#2563EB" />
  <text x="967" y="77" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Series #3 • Industrial Eng. Optimization</text>

  <!-- CARD 1: DECISION VARIABLES -->
  <rect x="36" y="144" width="336" height="312" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.8" filter="url(#cardShadow3)" />
  <rect x="36" y="144" width="336" height="48" rx="14" fill="#DBEAFE" />
  <rect x="36" y="176" width="336" height="16" fill="#DBEAFE" />
  <text x="204" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#1E40AF">1. DECISION VARIABLES (x)</text>
  <text x="204" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">"The Levers We Control"</text>
  <text x="204" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Independent inputs we freely choose</text>
  <line x1="60" y1="254" x2="348" y2="254" stroke="#E2E8F0" stroke-width="1.2" />
  <rect x="56" y="268" width="296" height="168" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="72" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563EB">CATERING ANALOGY:</text>
  <text x="72" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1E293B">• x₁ = Standard Meal Boxes</text>
  <text x="84" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Portions to cook tomorrow</text>
  <text x="72" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1E293B">• x₂ = Premium Meal Boxes</text>
  <text x="84" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Portions to cook tomorrow</text>
  <rect x="72" y="402" width="264" height="24" rx="6" fill="#EFF6FF" />
  <text x="204" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#1D4ED8">Input vector: x = [ x₁ , x₂ ]</text>

  <!-- ARROW 1 TO 2 -->
  <line x1="382" y1="300" x2="418" y2="300" stroke="#64748B" stroke-width="2.5" />
  <polygon points="416,293 428,300 416,307" fill="#64748B" />

  <!-- CARD 2: CONSTRAINTS -->
  <rect x="432" y="144" width="336" height="312" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.8" filter="url(#cardShadow3)" />
  <rect x="432" y="144" width="336" height="48" rx="14" fill="#FEF3C7" />
  <rect x="432" y="176" width="336" height="16" fill="#FEF3C7" />
  <text x="600" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#92400E">2. CONSTRAINTS (g(x) ≤ b)</text>
  <text x="600" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">"The Rules &amp; Boundaries"</text>
  <text x="600" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Resource limits that define feasible choices</text>
  <line x1="456" y1="254" x2="744" y2="254" stroke="#E2E8F0" stroke-width="1.2" />
  <rect x="452" y="268" width="296" height="168" rx="10" fill="#FFFBEB" stroke="#FDE68A" />
  <text x="468" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309">KITCHEN LIMITATIONS:</text>
  <text x="468" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">• Grocery Budget Limit:</text>
  <text x="480" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Ingredient cost ≤ Daily cash cap</text>
  <text x="468" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">• Cooking Time Limit:</text>
  <text x="480" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Prep minutes ≤ 480 mins (8 hrs)</text>
  <rect x="468" y="402" width="264" height="24" rx="6" fill="#FEF3C7" />
  <text x="600" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#92400E">Non-negativity: x₁ ≥ 0, x₂ ≥ 0</text>

  <!-- ARROW 2 TO 3 -->
  <line x1="778" y1="300" x2="814" y2="300" stroke="#64748B" stroke-width="2.5" />
  <polygon points="812,293 824,300 812,307" fill="#64748B" />

  <!-- CARD 3: OBJECTIVE FUNCTION -->
  <rect x="828" y="144" width="336" height="312" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.8" filter="url(#cardShadow3)" />
  <rect x="828" y="144" width="336" height="48" rx="14" fill="#D1FAE5" />
  <rect x="828" y="176" width="336" height="16" fill="#D1FAE5" />
  <text x="996" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#065F46">3. OBJECTIVE FUNCTION f(x)</text>
  <text x="996" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">"The Ultimate Target"</text>
  <text x="996" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Performance metric to Maximize or Minimize</text>
  <line x1="852" y1="254" x2="1140" y2="254" stroke="#E2E8F0" stroke-width="1.2" />
  <rect x="848" y="268" width="296" height="168" rx="10" fill="#F0FDF4" stroke="#BBF7D0" />
  <text x="864" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#047857">BUSINESS GOAL:</text>
  <text x="864" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Maximize Total Daily Profit</text>
  <text x="864" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Sum of profit per Standard Box plus</text>
  <text x="864" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">profit per Premium Box cooked.</text>
  <rect x="864" y="394" width="264" height="32" rx="6" fill="#059669" />
  <text x="996" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Result: Optimal Plan (x₁*, x₂*)</text>

  <!-- BOTTOM PANEL: General Mathematical Blueprint -->
  <rect x="36" y="478" width="1128" height="114" rx="14" fill="#0F172A" />
  <text x="64" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#38BDF8">STANDARD TEXTBOOK BLUEPRINT (TRANSLATED)</text>
  <rect x="64" y="522" width="320" height="52" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="224" y="544" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF">Optimize f(x)</text>
  <text x="224" y="563" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94A3B8">Find best value of the goal function</text>
  <rect x="404" y="522" width="360" height="52" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="584" y="544" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FBBF24">Subject to: gᵢ(x) ≤ bᵢ</text>
  <text x="584" y="563" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94A3B8">Obey every resource &amp; capacity limit</text>
  <rect x="784" y="522" width="352" height="52" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="960" y="544" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#34D399">x ∈ S (Feasible Region)</text>
  <text x="960" y="563" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94A3B8">Only valid, realistic combinations allowed</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
