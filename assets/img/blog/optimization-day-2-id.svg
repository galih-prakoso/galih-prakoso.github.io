 <path d="M 660.0 248.4 L 674.1 287.7 L 688.1 313.9 L 702.2 332.6 L 716.2 346.7 L 730.3 357.6 L 744.4 366.4 L 758.4 373.5 L 772.5 379.5 L 786.6 384.5 L 800.6 388.8 L 814.7 392.6 L 828.8 395.8 L 842.8 398.7 L 856.9 401.3 L 870.9 403.6 L 885.0 405.7 L 899.1 407.5 L 913.1 409.2 L 927.2 410.8 L 941.2 412.2 L 955.3 413.5 L 969.4 414.8 L 983.4 415.9 L 997.5 416.9 L 1011.6 417.9 L 1025.6 418.8 L 1039.7 419.6 L 1053.8 420.4 L 1067.8 421.2 L 1081.9 421.9 L 1095.9 422.5 L 1110.0 423.2" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" />

