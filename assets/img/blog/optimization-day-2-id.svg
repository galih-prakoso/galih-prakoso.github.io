 Stok turun linear dari <tspan font-weight="700" fill="#0F172A">Q</tspan> ke <tspan font-weight="700" fill="#0F172A">0</tspan>, sehingga rata-rata stok gudang adalah <tspan font-weight="700" fill="#B45309">Q / 2</tspan>.
 </text>

