 <path d="M 660.0 235.8 L 674.1 272.0 L 688.1 295.0 L 702.2 310.6 L 716.2 321.5 L 730.3 329.3 L 744.4 334.9 L 758.4 338.9 L 772.5 341.7 L 786.6 343.6 L 800.6 344.8 L 814.7 345.4 L 828.8 345.5 L 842.8 345.3 L 856.9 344.7 L 870.9 343.8 L 885.0 342.8 L 899.1 341.5 L 913.1 340.0 L 927.2 338.4 L 941.2 336.7 L 955.3 334.9 L 969.4 333.0 L 983.4 330.9 L 997.5 328.8 L 1011.6 326.6 L 1025.6 324.4 L 1039.7 322.1 L 1053.8 319.7 L 1067.8 317.3 L 1081.9 314.9 L 1095.9 312.4 L 1110.0 309.9" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />

